name: Documents

on:
  push:
    paths:
      - "packages/core/**"
      - "packages/extensions/documents/**"
      - ".github/workflows/documents.yml"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/extensions/documents/**"
      - ".github/workflows/documents.yml"
  workflow_dispatch:

jobs:
  document-extension:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        optional-dependencies: ["none", "all"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist/core packages/core
      - run: python -m build --wheel --outdir dist/documents packages/extensions/documents
      - run: python -m venv .venv-documents
      - run: .venv-documents/bin/python -m pip install pytest dist/core/*.whl dist/documents/*.whl
      - if: matrix.optional-dependencies == 'all'
        run: .venv-documents/bin/python -m pip install "dist/documents/$(basename dist/documents/*.whl)[all]"
      - run: .venv-documents/bin/python -m pip check
      - run: .venv-documents/bin/python -m pytest packages/extensions/documents/tests -q
      - run: .venv-documents/bin/python -m pytest tests/integration/test_document_formats_integration.py -q
      - run: .venv-documents/bin/python packages/extensions/documents/examples/basic_usage.py
      - run: .venv-documents/bin/python -m pip uninstall -y dataindex-ext-documents
      - run: .venv-documents/bin/python -m pip check
      - run: .venv-documents/bin/python -c "import dataindex; print(dataindex.__version__)"
      - run: .venv-documents/bin/python -m dataindex extensions list
