name: Commercial contract fixture

on:
  push:
    paths:
      - "packages/core/**"
      - "packages/extensions/documents/**"
      - "tests/plugins/mock_premium/**"
      - "examples/mixed_sources.py"
      - "README.md"
      - "packages/core/README.md"
      - ".github/workflows/commercial.yml"
      - "docs/EXTENSION_CONTRACT.md"
      - "docs/SECURITY_AND_ENTITLEMENTS.md"
      - "docs/REPOSITORY_AND_PACKAGING.md"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/extensions/documents/**"
      - "tests/plugins/mock_premium/**"
      - "examples/mixed_sources.py"
      - "README.md"
      - "packages/core/README.md"
      - ".github/workflows/commercial.yml"
      - "docs/EXTENSION_CONTRACT.md"
      - "docs/SECURITY_AND_ENTITLEMENTS.md"
      - "docs/REPOSITORY_AND_PACKAGING.md"
  workflow_dispatch:

jobs:
  premium-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist/core packages/core
      - run: python -m build --wheel --outdir dist/documents packages/extensions/documents
      - run: python -m build --wheel --outdir dist/databases packages/extensions/databases
      - run: python -m build --wheel --outdir dist/mock-premium tests/plugins/mock_premium
      - run: python -m venv .venv-commercial
      - run: .venv-commercial/bin/python -m pip install pytest dist/core/*.whl dist/documents/*.whl dist/databases/*.whl dist/mock-premium/*.whl
      - run: .venv-commercial/bin/python -m pip check
      - run: .venv-commercial/bin/python -m pytest packages/extensions/documents/tests -q -p no:cacheprovider
      - run: .venv-commercial/bin/python -m pytest packages/extensions/databases/tests -q -p no:cacheprovider
      - run: .venv-commercial/bin/python -m pytest tests/plugins/mock_premium/tests -q -p no:cacheprovider
      - run: .venv-commercial/bin/python -m pip uninstall -y dataindex-ext-mock-premium dataindex-ext-documents dataindex-ext-databases
      - run: .venv-commercial/bin/python -m pip check
      - run: .venv-commercial/bin/python -m pytest packages/core/tests -q -p no:cacheprovider
      - run: .venv-commercial/bin/python -c "import dataindex; print(dataindex.__version__)"
      - run: .venv-commercial/bin/python -m dataindex extensions list
