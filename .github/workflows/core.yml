name: Core

on:
  push:
    paths:
      - "packages/core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "packages/core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python -m build --wheel --outdir dist
      - run: python -m venv .venv-core
      - run: .venv-core/bin/python -m pip install dist/dataindex_core-0.1.0-py3-none-any.whl
      - run: .venv-core/bin/python -m pip check
      - run: .venv-core/bin/python -c "import dataindex; print(dataindex.__version__)"
      - run: .venv-core/bin/dataindex extensions list
