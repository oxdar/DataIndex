[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataindex-ext-databases"
version = "0.1.0"
description = "Bounded, read-only schema indexing and approved queries over SQLite, DuckDB and database servers for DataIndex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataindex-core>=0.1,<0.2",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.2,<3",
]
postgresql = [
    "SQLAlchemy>=2.0.30,<2.2",
    "psycopg[binary]>=3.2,<4",
]
mysql = [
    "SQLAlchemy>=2.0.30,<2.2",
    "PyMySQL[rsa]>=1.1,<2",
]
mssql = [
    "SQLAlchemy>=2.0.30,<2.2",
    "pyodbc>=5.0,<6",
]
oracle = [
    "SQLAlchemy>=2.0.30,<2.2",
    "oracledb>=2.0,<27",
]
snowflake = [
    "SQLAlchemy>=2.0.30,<2.2",
    "snowflake-sqlalchemy>=1.7,<3",
]
bigquery = [
    "SQLAlchemy>=2.0.30,<2.2",
    "sqlalchemy-bigquery>=1.11,<2",
]
clickhouse = [
    "SQLAlchemy>=2.0.30,<2.2",
    "clickhouse-connect>=0.8,<2",
]
mongodb = [
    "pymongo>=4.6,<5",
]
all = [
    "dataindex-ext-databases[duckdb,postgresql,mysql,mssql,oracle,snowflake,bigquery,clickhouse,mongodb]",
]
test = [
    "build>=1.2",
    "pytest>=8.0",
    "mongomock>=4.1,<5",
]

[project.entry-points."dataindex.extensions"]
databases = "dataindex_ext_databases.plugin:load_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataindex_ext_databases = ["dataindex-extension.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
