[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataindex-ext-databases"
version = "0.1.0"
description = "Bounded, read-only SQLite schema indexing and retrieval for DataIndex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataindex-core>=0.1,<0.2",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.entry-points."dataindex.extensions"]
databases = "dataindex_ext_databases.plugin:load_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataindex_ext_databases = ["dataindex-extension.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
