[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataindex-ext-documents"
version = "0.1.0"
description = "Natural-structure indexing of documents, office files, PDFs and data files for DataIndex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataindex-core>=0.1,<0.2",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=7.1.0,<8",
]
legacy-office = [
    "olefile>=0.47,<1",
    "xlrd>=2.0.2,<3",
]
all = [
    "dataindex-ext-documents[pdf,legacy-office]",
]
test = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.entry-points."dataindex.extensions"]
documents = "dataindex_ext_documents.plugin:load_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataindex_ext_documents = ["dataindex-extension.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
